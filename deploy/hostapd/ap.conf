###############################################################################
# /etc/hostapd/ft8-ap.conf
#
# 2.4 GHz AP for the Pi's fallback mode.
#
# This file IS the source of truth for the AP passphrase. install.sh copies
# it verbatim to /etc/hostapd/ft8-ap.conf and nothing rewrites it afterwards
# — the network.ap_fallback.psk value in config.yaml (random per install) is
# shown in the UI but is NOT what hostapd uses. Deliberate (2026-09-06): a
# public repo ships a placeholder, the operator sets the real passphrase on
# the Pi:
#   sudo sed -i 's/^wpa_passphrase=.*/wpa_passphrase=NEW/' /etc/hostapd/ft8-ap.conf
###############################################################################

interface=wlan0
driver=nl80211

# WiFi country code is legally relevant. It is NOT set from the GPS position
# anywhere (start-ap-fallback.sh only brings up the interface and services);
# DE is what the AP runs with unless edited here.
country_code=DE
ieee80211d=1

ssid=ft8-hotspot
hw_mode=g
channel=6

# WPA2-PSK
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Placeholder for the public repo — NOT rewritten from config.yaml. Set the
# real passphrase in /etc/hostapd/ft8-ap.conf on the Pi (see header).
wpa_passphrase=changeme-please

# We don't broadcast on 5 GHz to keep it simple + maximally compatible
ignore_broadcast_ssid=0
