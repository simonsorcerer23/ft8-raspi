# Journal auf die Platte statt in den Arbeitsspeicher.
#
# Raspberry Pi OS liefert /usr/lib/systemd/journald.conf.d/
# 40-rpi-volatile-storage.conf mit Storage=volatile aus. Das Journal liegt
# dann in /run (tmpfs) und ist nach jedem Neustart weg — auch die Logs, die
# man nach einem Absturz gerade braucht. Am 2026-09-12 fiel auf, dass die
# Station seit der NVMe-Migration so lief: Der aelteste Journaleintrag war
# exakt der Boot-Zeitpunkt, jede Spur davor fehlte.
#
# Die Vorgabe ist fuer SD-Karten gedacht, die man schonen will. Ein Pi, der
# von NVMe oder SSD bootet, hat dieses Problem nicht, und die Logs sind die
# einzige Spur, wenn etwas schiefgeht.
#
# Die Ziffer 99 ist Absicht: Drop-ins werden alphabetisch ueber alle
# Verzeichnisse hinweg gelesen, /etc gewinnt nur bei gleichem Dateinamen.
# Eine 10-... in /etc verliert gegen die 40-... aus /usr/lib.
[Journal]
Storage=persistent
SystemMaxUse=2G
