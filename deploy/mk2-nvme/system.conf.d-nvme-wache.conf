# /etc/systemd/system.conf.d/nvme-wache.conf am MK2-Pi (seit 2026-11-16).
# systemd gibt den Hardware-Watchdog ab; ihn bedient die NVMe-Wache, die
# aufhoert, sobald die NVMe weg ist. systemd selbst bediente ihn auch am
# 16.11. weiter, waehrend der Pi nach dem NVMe-Ausfall 4,5 Stunden stand.
[Manager]
RuntimeWatchdogSec=off
